services:
  mysql:
    image: mysql:9.7
    container_name: eval3-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "${MYSQL_PUBLISH_PORT:-3306}:3306"
    volumes:
      - eval3_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mysqladmin ping -h localhost -uroot -p"$$MYSQL_ROOT_PASSWORD" || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 25s
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

  app:
    build: .
    container_name: eval3-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      - eval3_node_modules:/app/node_modules
    depends_on:
      mysql:
        condition: service_healthy
    command:
      - sh
      - -c
      - pnpm install && pnpm exec prisma generate && pnpm exec prisma db push --skip-generate && pnpm exec next dev -H 0.0.0.0 -p 3000

volumes:
  eval3_mysql_data:
  eval3_node_modules:
